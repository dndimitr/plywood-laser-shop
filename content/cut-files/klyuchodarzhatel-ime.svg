<?xml version="1.0" encoding="UTF-8"?>
<!-- LightBurn demo: engraved-name keychain. Red=Cut, Black=Engrave. Units: mm -->
<svg xmlns="http://www.w3.org/2000/svg" width="50mm" height="30mm" viewBox="0 0 50 30">
  <title>klyuchodarzhatel-ime — LightBurn cut file</title>
  <!-- Outer shape with rounded ends -->
  <path
    fill="none"
    stroke="#ff0000"
    stroke-width="0.1"
    d="M 10 2
       H 40
       A 8 8 0 0 1 40 28
       H 10
       A 8 8 0 0 1 10 2
       Z"
  />
  <!-- Hang hole -->
  <circle cx="10" cy="15" r="2.4" fill="none" stroke="#ff0000" stroke-width="0.1"/>
  <!-- Engrave guide rectangle (replace text in LightBurn after personalization) -->
  <rect x="18" y="10" width="24" height="10" fill="none" stroke="#000000" stroke-width="0.15"/>
  <!-- Sample engrave text (demo) -->
  <text
    x="30"
    y="17.5"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="5"
    fill="#000000"
  >ANA</text>
</svg>
